name: Docker
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

# amd64-only on luxfi's native ARC pool — the SPA build (Next.js + 8GB
# heap) + Go cgo-sqlite Docker build under QEMU arm64 emulation pushes
# build time from ~5 min to ~2 hours. Cluster runners are amd64; Mac
# devs use OrbStack which has its own arm64 base image story. arm64
# rebuilds can come back via a separate matrix entry on a native
# arm64 runner — not via QEMU.
jobs:
  docker:
    # In-cluster ARC pool (lux-build autoscalingrunnerset in lux-k8s, org-scoped
    # to github.com/luxfi, amd64). The classic [self-hosted, linux, amd64] triple
    # is serviced by fleet arcd hosts that are not reliably available; lux-build
    # scales 0->N on demand and is the canonical luxfi image-build pool.
    runs-on: lux-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
      # The Dockerfile resolves private luxfi/* modules (graph, indexer, crypto,
      # ...) via go mod, and the GHCR push needs org-wide package write. The
      # default GITHUB_TOKEN is repo-scoped and cannot do either reliably, so
      # resolve a cross-org PAT (org GH_TOKEN, else repo UNIVERSE_PAT — both carry
      # write:packages) and use it for BOTH the ghcr login and the BuildKit
      # secret `ghtok`. Same mechanism as luxfi/node's docker.yml.
      - id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: |
          tok="$GH_TOKEN"; src="GH_TOKEN"
          if [ -z "$tok" ]; then tok="$UNIVERSE_PAT"; src="UNIVERSE_PAT"; fi
          if [ -z "$tok" ]; then
            echo "::error::No GH_TOKEN or UNIVERSE_PAT secret set — go mod download / package push will fail on private luxfi/*"
            exit 1
          fi
          echo "Using secret: $src (length=${#tok})"
          echo "::add-mask::$tok"
          { echo "token<<EOF"; echo "$tok"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ steps.pat.outputs.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/explorer
          flavor: latest=auto
          labels: |
            org.opencontainers.image.source=https://github.com/luxfi/explorer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            ghtok=${{ steps.pat.outputs.token }}
          cache-from: type=registry,ref=ghcr.io/luxfi/explorer:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/luxfi/explorer:buildcache-amd64,mode=max
          provenance: false
          push: true
