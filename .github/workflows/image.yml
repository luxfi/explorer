name: image

# The explorer, as an image, for both architectures.
#
# This repository had no image workflow, so the published tags predate the
# frontend it now embeds: 1.5.49 serves /v1 and 404s on /, which is why five
# separate frontend pods exist to serve what this binary already carries.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            pool: linux-amd64
          - arch: arm64
            pool: linux-arm64
    runs-on: ['${{ matrix.pool }}']
    timeout-minutes: 60
    steps:
      # One docker config per RUNNER: several runner services share this
      # machine’s HOME, and docker/login-action logs out in its post step,
      # so a job that finishes takes the credential from a job still
      # pushing. Set here rather than in the job env, where the runner
      # context does not exist and naming it is a syntax error.
      - name: One docker config per runner
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"
          echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GH_PAT, because it is the credential that demonstrably works here:
          # the private checkouts in this fleet authenticate with it. Neither
          # GITHUB_TOKEN (scoped to the repository, not the package) nor the
          # GHCR_USER/GHCR_TOKEN pair got past "User cannot be authenticated
          # with the token provided" on the first publish of this package.
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - name: Build and push this architecture
        run: |
          set -euo pipefail
          img=ghcr.io/luxfi/explorer
          docker build -t "$img:${GITHUB_SHA::7}-${{ matrix.arch }}" .
          docker push "$img:${GITHUB_SHA::7}-${{ matrix.arch }}"

  merge:
    needs: image
    runs-on: [linux-amd64]
    permissions:
      packages: write
    steps:
      # One docker config per RUNNER: several runner services share this
      # machine’s HOME, and docker/login-action logs out in its post step,
      # so a job that finishes takes the credential from a job still
      # pushing. Set here rather than in the job env, where the runner
      # context does not exist and naming it is a syntax error.
      - name: One docker config per runner
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"
          echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GH_PAT, because it is the credential that demonstrably works here:
          # the private checkouts in this fleet authenticate with it. Neither
          # GITHUB_TOKEN (scoped to the repository, not the package) nor the
          # GHCR_USER/GHCR_TOKEN pair got past "User cannot be authenticated
          # with the token provided" on the first publish of this package.
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      # One name carrying both, so it cannot pull on one arch and fail on the other.
      - name: One name, both architectures
        run: |
          set -euo pipefail
          img=ghcr.io/luxfi/explorer
          docker buildx imagetools create -t "$img:${GITHUB_SHA::7}" -t "$img:main" \
            "$img:${GITHUB_SHA::7}-amd64" "$img:${GITHUB_SHA::7}-arm64"
          docker buildx imagetools inspect "$img:${GITHUB_SHA::7}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}'
