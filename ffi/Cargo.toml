[package]
name = "lux_explorer_ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C-ABI staticlib that runs the Blockscout-rs explorer services in-process inside the Lux explorer Go binary (cgo). One Rust std copy wraps every needed service so the Go binary links a single .a."

# staticlib => a single self-contained `liblux_explorer_ffi.a` that cgo links
# directly into the explorer Go binary. We deliberately use ONE staticlib for
# ALL wrapped services (not one .a per service) so there is exactly one copy of
# the Rust std / panic runtime and no duplicate-symbol conflicts at link time.
[lib]
name = "lux_explorer_ffi"
crate-type = ["staticlib"]

[dependencies]
# Shared runtime glue. Tokio is built per-service-thread (see src/lib.rs); these
# are the only crates the FFI shim itself needs. anyhow is the common error type
# every wrapped service entrypoint returns; tokio drives the per-service runtime.
libc = "0.2"
serde_json = "1"
once_cell = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# The ONE C-SQLite for the whole single binary. DB-backed services (stats,
# multichain) pull sqlx-sqlite -> libsqlite3-sys; `bundled-sqlcipher` compiles a
# single full SQLCipher amalgamation INTO this staticlib (unlock_notify +
# load_extension + the SQLCipher codec, CommonCrypto on Apple — no OpenSSL). The
# Go side's mattn/go-sqlite3 is built `-tags "libsqlite3 sqlite_unlock_notify"`
# so it REFERENCES these symbols instead of bundling a second copy => zero
# duplicate `_sqlite3_*` symbols when cgo links the .a. Activated only by the
# DB-backed features (a pure sig-provider build never compiles it).
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher", "unlock_notify"], optional = true }

# --- Wrapped services (path deps into the sibling explorer-rs checkout) -------
# explorer-rs lives at ../../explorer-rs relative to this crate
# (/Users/a/work/lux/explorer/ffi -> /Users/a/work/lux/luxfi/explorer-rs).
# Each service is its OWN cargo workspace with no root workspace, so a plain
# path dep on the `*-server` crate pulls exactly that service's dependency
# graph. Each is feature-gated so a default `cargo build` (no --features) builds
# only the FFI shim + stubs and stays fast; turn services on individually.
#
# sig-provider is wired and proven first: it is stateless (no DB, no
# migrations), so it links and runs with the least build cost. Adding another
# service is a two-line change: (1) add its path dep below under a matching
# feature, (2) add a `service!{...}` entry in src/lib.rs. See README.md.
sig-provider-server = { path = "../../explorer-rs/sig-provider/sig-provider-server", optional = true }

# stats: DB-backed. Runs on SQLite (no Postgres) via the launcher's
# initialize_database — its db_url is sqlite://<vfs-mount>/stats.db?mode=rwc,
# supplied by services.go from the hanzoai/vfs mountpoint. NOTE: stats' sea-orm
# migrations are Postgres-specific and do not yet run on SQLite (see
# stats-server/tests/sqlite_migration.rs — the first migration's
# `CREATE TYPE … AS ENUM` fails); connecting is proven, migration porting is the
# documented follow-up. stats pins tonic 0.12, so it is its own cargo workspace
# pulled as a path dep (does not share the 0.21 launcher graph).
stats-server = { path = "../../explorer-rs/stats/stats-server", optional = true }

# multichain-aggregator: DB-backed. Its sea-orm MIGRATIONS are ported + PROVEN on
# SQLite (multichain-aggregator-migration/tests/sqlite_migration.rs — green), and
# the FFI scaffold here is complete: the `service!` block + the Go extern + the
# ffiStarters entry are wired so that the moment the server compiles, it runs
# in-process and the zip front already routes /v1/multichain/* to it (services.go
# has it in defaultPrefix + dbBackedServices, proven by
# TestResolveServicesStampsSQLiteUrlOnVFSMount). Its entrypoint is
# `multichain_aggregator_server::run(Settings)`.
#
# It is OPTIONAL and NOT in `all` because the SERVER has TWO upstream-dep blockers
# (neither is the single-binary architecture, both are documented follow-ups):
#   1. CO-LINK: it pins blockscout-service-launcher 0.21 / tonic 0.14 / prost 0.14
#      — INCOMPATIBLE majors with stats' 0.19 / 0.12 / 0.13, so the two proto
#      build graphs can't resolve in one staticlib (same skew that keeps
#      sig-provider separate).
#   2. STANDALONE: even alone (`cargo build --features multichain-aggregator`) it
#      currently fails to compile in a transitive dep — `api-client-framework`
#      hits a `reqwest-middleware 0.4.2` Middleware trait-bound mismatch. That is
#      a version skew INSIDE multichain-server's own graph, upstream of this crate.
# Because disabled services still export their symbol (LUX_FFI_ERR_DISABLED), the
# default `stats` build links the multichain entrypoint as a STUB — the Go binary
# is byte-identical whether or not this feature compiles. When both upstream deps
# are reconciled, flip it on with `make FFI_FEATURES=multichain-aggregator` (alone)
# and it goes live with zero Go-side changes.
multichain-aggregator-server = { path = "../../explorer-rs/multichain-aggregator/multichain-aggregator-server", optional = true }

# The remaining services are listed (commented) with their exact paths so
# scaling out is mechanical. They are NOT enabled by default because each pins a
# DIFFERENT major of blockscout-service-launcher (0.10/0.13/0.17/0.19/0.21) and
# pulls DB/migration stacks (sea-orm) — combining incompatible majors fails to
# build, so enable one at a time and verify the link. See README.md "Scaling
# out" for the exact recipe.
#
# sig-provider pins launcher 0.10 / tonic 0.8 — also its own staticlib.
# sig-provider-server              = { path = "../../explorer-rs/sig-provider/sig-provider-server", optional = true }  (declared above)
# smart-contract-verifier-server   = { path = "../../explorer-rs/smart-contract-verifier/smart-contract-verifier-server", optional = true }
# visualizer-server                = { path = "../../explorer-rs/visualizer/visualizer-server", optional = true }

[features]
# Default = no service compiled in: the staticlib still builds (fast) and every
# entrypoint returns LUX_FFI_ERR_DISABLED so the Go side links and degrades
# gracefully. `make single` turns on the services it wants.
default = []
sig-provider = ["dep:sig-provider-server"]
# stats is DB-backed: pull the bundled SQLCipher so its sqlx-sqlite links the
# single in-staticlib C SQLite (see the libsqlite3-sys dep note above).
stats = ["dep:stats-server", "dep:libsqlite3-sys"]
# multichain-aggregator is DB-backed too (same bundled-SQLCipher). Build it ALONE
# (`make FFI_FEATURES=multichain-aggregator`); it is NOT in `all` because its
# launcher/tonic/prost majors are incompatible with stats (see the dep note).
multichain-aggregator = ["dep:multichain-aggregator-server", "dep:libsqlite3-sys"]
# smart-contract-verifier = ["dep:smart-contract-verifier-server"]
# visualizer = ["dep:visualizer-server"]

# Convenience: every CO-LINKABLE service at once. stats is the DB-backed default;
# multichain-aggregator and sig-provider each pin incompatible launcher/tonic
# majors, so they are built alone (FFI_FEATURES=<svc>), not bundled here.
all = ["stats"]

[profile.release]
# Smaller, faster-linking staticlib. LTO off keeps incremental builds sane while
# scaling services out; flip to "thin" for a production single binary.
lto = false
codegen-units = 16
