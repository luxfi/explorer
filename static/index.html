<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lux Explorer</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script src="/envs.js"></script>
<style>
  :root{--bg:#0b1220;--card:#111a2c;--fg:#e6edf3;--mut:#7d8590;--ac:#5cf;--brd:#1f2a3d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
  a{color:var(--ac);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--brd);background:#0a0f1c}
  header img{width:28px;height:28px}
  header h1{font-size:16px;font-weight:600}
  header .chip{margin-left:auto;padding:4px 10px;border:1px solid var(--brd);border-radius:6px;color:var(--mut);font-size:12px}
  header select{background:#0a0f1c;color:var(--fg);border:1px solid var(--brd);padding:6px 10px;border-radius:6px;font-size:13px}
  main{max-width:1200px;margin:0 auto;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:16px}
  .card h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:8px}
  .card .v{font-size:22px;font-weight:600}
  section{background:var(--card);border:1px solid var(--brd);border-radius:8px;margin-bottom:24px;overflow:hidden}
  section h2{padding:14px 18px;border-bottom:1px solid var(--brd);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 18px;text-align:left;font-size:13px;border-bottom:1px solid var(--brd)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;background:#0a0f1c}
  td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  td.r{text-align:right}
  .err{color:#f85149;padding:16px;font-size:13px}
  .age{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <img id="logo" src="/logo.svg" alt="">
  <h1 id="brand">Explorer</h1>
  <select id="network" title="Network"></select>
  <select id="chain" title="Chain"></select>
  <span class="chip" id="chip"></span>
</header>
<main>
  <div class="grid" id="kpi"></div>
  <section><h2>Latest Blocks</h2><div id="blocks"></div></section>
  <section><h2>Latest Transactions</h2><div id="txs"></div></section>
</main>
<script>
(() => {
  const ENV = window.ENV || {};
  const BRAND = ENV.VITE_BRAND || {};
  const CHAINS = (ENV.VITE_CHAINS || []).filter(c => c.type === 'evm' || !c.type);
  // Network host derivation. Prefer server-supplied values (v1.2.20+ go
  // binary fills VITE_CURRENT_NETWORK and VITE_NETWORK_HOSTS), fall back
  // to client-side parsing so the network switcher still works on older
  // images (v1.2.18) where /envs.js doesn't ship the fields.
  const networkFromHost = (host) => {
    host = (host || '').toLowerCase().split(':')[0];
    if (!host || host === 'localhost' || /^[0-9.]+$/.test(host)) return null;
    if (host.endsWith('.svc.cluster.local') || host.endsWith('.local')) return null;
    const m = host.match(/^(explore|explorer|api-explore|api-explorer)([.-])([a-z][a-z0-9]+)(?:-(test|testnet|dev|devnet|local))?(\.[^.]+(?:\.[^.]+)*)$/);
    if (!m) return null;
    const [, , sep, brand, envTag, tail] = m;
    const env = envTag || '';
    // sep==='.' → brand-owned host (explore.zoo.network); preserve tail
    // on mainnet. sep==='-' → lux.network-prefix host
    // (explore-zoo.lux.network); force tail to .network on mainnet
    // since brand-owned mainnet aliases are always *.network.
    const mainnetTail = (sep === '.' && env === '') ? tail : '.network';
    return {
      current: env || 'mainnet',
      hosts: {
        mainnet: 'explore.' + brand + mainnetTail,
        testnet: 'explorer.' + brand + '-test.network',
      },
    };
  };
  const fallback = networkFromHost(location.host) || {current:'',hosts:{}};
  const NETWORK_HOSTS = ENV.VITE_NETWORK_HOSTS && Object.keys(ENV.VITE_NETWORK_HOSTS).length
    ? ENV.VITE_NETWORK_HOSTS : fallback.hosts;
  const CURRENT_NETWORK = ENV.VITE_CURRENT_NETWORK || fallback.current;
  const PATH_BASE = '/v1/indexer';
  const $ = s => document.querySelector(s);
  const fmt = n => (n == null || n === '') ? '–' : Number(n).toLocaleString();
  const short = h => h ? h.slice(0,10) + '…' + h.slice(-6) : '';
  const age = t => {
    if (!t) return '';
    const s = (Date.now() - new Date(t).getTime())/1000;
    if (s < 60) return Math.round(s)+'s ago';
    if (s < 3600) return Math.round(s/60)+'m ago';
    if (s < 86400) return Math.round(s/3600)+'h ago';
    return Math.round(s/86400)+'d ago';
  };

  // Pick chain from URL hash (#cchain), localStorage, or default.
  const slugFromHash = location.hash.replace(/^#/, '').trim();
  const stored = localStorage.getItem('explorer.slug');
  const def = (CHAINS.find(c=>c.default) || CHAINS[0] || {}).slug;
  let current = CHAINS.find(c=>c.slug === slugFromHash)
              || CHAINS.find(c=>c.slug === stored)
              || CHAINS.find(c=>c.slug === def)
              || CHAINS[0];

  // Render branding.
  if (BRAND.name) $('#brand').textContent = BRAND.name;
  if (BRAND.iconUrl) $('#logo').src = BRAND.iconUrl;
  if (BRAND.accentColor) document.documentElement.style.setProperty('--ac', BRAND.accentColor);

  // Network picker — hidden unless we have at least two siblings.
  const netSel = $('#network');
  const labels = Object.keys(NETWORK_HOSTS);
  if (labels.length >= 2 && CURRENT_NETWORK) {
    labels.sort();
    labels.forEach(label => {
      const o = document.createElement('option');
      o.value = label;
      o.textContent = label.charAt(0).toUpperCase() + label.slice(1);
      if (label === CURRENT_NETWORK) o.selected = true;
      netSel.appendChild(o);
    });
    netSel.onchange = () => {
      const target = NETWORK_HOSTS[netSel.value];
      if (!target || target === location.host) return;
      // Preserve protocol + path + hash so the user lands on the same
      // chain/page on the sibling network.
      location.href = location.protocol + '//' + target + location.pathname + location.hash;
    };
  } else {
    netSel.style.display = 'none';
  }

  // Chain picker.
  const sel = $('#chain');
  CHAINS.forEach(c => {
    const o = document.createElement('option');
    o.value = c.slug;
    o.textContent = c.name + ' (' + (c.coin || '') + ')';
    if (current && c.slug === current.slug) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    current = CHAINS.find(c => c.slug === sel.value) || current;
    localStorage.setItem('explorer.slug', current.slug);
    location.hash = current.slug;
    render();
  };

  async function jget(path){
    const r = await fetch(path, {headers:{accept:'application/json'}});
    if (!r.ok) throw new Error(path + ' → ' + r.status);
    return r.json();
  }

  async function loadStats(slug){
    return jget(PATH_BASE + '/' + slug + '/stats');
  }
  async function loadBlocks(slug){
    return jget(PATH_BASE + '/' + slug + '/blocks?items_count=10');
  }
  async function loadTxs(slug){
    return jget(PATH_BASE + '/' + slug + '/transactions?items_count=10');
  }

  function renderKpi(stats, chain){
    const items = [
      ['Chain ID', chain.chainId || '–'],
      ['Blocks', fmt(stats.total_blocks)],
      ['Transactions', fmt(stats.total_transactions)],
      ['Addresses', fmt(stats.total_addresses)],
      ['Avg block', stats.average_block_time ? stats.average_block_time + 'ms' : '–'],
      ['Gas used today', fmt(stats.gas_used_today)],
    ];
    $('#kpi').innerHTML = items.map(([k,v]) =>
      '<div class="card"><h3>'+k+'</h3><div class="v">'+v+'</div></div>'
    ).join('');
  }

  function renderBlocks(blocks){
    const rows = (blocks.items || []).map(b => {
      const ts = b.timestamp ? new Date(b.timestamp).toISOString() : '';
      return '<tr>'
        + '<td class="r">'+fmt(b.height)+'</td>'
        + '<td class="mono">'+short(b.hash)+'</td>'
        + '<td class="r">'+fmt(b.tx_count)+'</td>'
        + '<td class="age">'+age(b.timestamp)+'</td>'
        + '</tr>';
    }).join('');
    $('#blocks').innerHTML = rows
      ? '<table><thead><tr><th class="r">#</th><th>Hash</th><th class="r">Txs</th><th>Age</th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div class="err">No blocks indexed yet.</div>';
  }

  function renderTxs(txs){
    const rows = (txs.items || []).map(t => {
      return '<tr>'
        + '<td class="mono">'+short(t.hash)+'</td>'
        + '<td class="mono">'+short(t.from && t.from.hash)+'</td>'
        + '<td class="mono">'+short(t.to && t.to.hash)+'</td>'
        + '<td class="age">'+age(t.timestamp)+'</td>'
        + '</tr>';
    }).join('');
    $('#txs').innerHTML = rows
      ? '<table><thead><tr><th>Hash</th><th>From</th><th>To</th><th>Age</th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div class="err">No transactions indexed yet.</div>';
  }

  async function render(){
    if (!current){
      document.body.innerHTML = '<div class="err" style="padding:32px">No chains configured. Check window.ENV.</div>';
      return;
    }
    $('#chip').textContent = (current.coin || '') + ' • ' + (current.chainId || '');
    document.title = current.name + ' — ' + (BRAND.name || 'Explorer');
    try {
      const [s, b, t] = await Promise.allSettled([
        loadStats(current.slug),
        loadBlocks(current.slug),
        loadTxs(current.slug),
      ]);
      renderKpi(s.value || {}, current);
      renderBlocks(b.value || {});
      renderTxs(t.value || {});
    } catch (e) {
      $('#kpi').innerHTML = '<div class="err">'+e.message+'</div>';
    }
  }

  render();
  setInterval(render, 15000);
})();
</script>
</body>
</html>
