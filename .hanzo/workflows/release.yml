name: Release

# Builds ghcr.io/luxfi/explorer on the native runners (git.hanzo.ai → git-runner).
#
# This replaces .github/workflows/docker.yml, which ran on `runs-on: lux-build` —
# an ARC autoscaling runner set that no longer exists. Neither cluster has the ARC
# CRDs, and github.com/luxfi reports zero runners at org and repo scope, so every
# v* tag queued a job nothing could pick up. A job naming a label no runner carries
# does not fail; it waits. That is why v1.5.4 was tagged and never became an image.
#
# Same shape as luxfi/graph's release.yml: ghcr auth via the org GHCR_USER /
# GHCR_TOKEN secrets sourced from KMS (the instance GITHUB_TOKEN on this forge is a
# Hanzo Git token and carries no rights at ghcr.io), and a registry layer cache
# rather than type=gha, which is a GitHub-hosted service.
#
# Semver-only: only a v* tag produces a {{version}} manifest, plus an immutable sha
# tag on every run. No :latest, no floating tags.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A release is not made irrelevant by a newer one — let it finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/explorer
          flavor: latest=false
          labels: |
            org.opencontainers.image.source=https://github.com/luxfi/explorer
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # amd64 only. The pool is amd64, and this build (cgo + sqlite) under QEMU
      # arm64 emulation goes from minutes to hours; arm64 returns when we own an
      # arm64 runner, as a native matrix entry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/luxfi/explorer:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/luxfi/explorer:buildcache-amd64,mode=max
          provenance: false
          push: true
